name: MeloTV
options:
  bundleIdPrefix: com.melotv
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"          # 3 == Apple TV
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CODE_SIGNING_ALLOWED: NO             # unsigned; signed later with Sideloadly
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # Replaces the prebuilt, iOS-only RyujinxHelper.framework. The emulator core
  # reaches these six symbols through DllImport("RyujinxHelper.framework/RyujinxHelper"),
  # so the framework name and the C symbol names both have to match exactly.
  RyujinxHelper:
    type: framework
    platform: tvOS
    sources: [Helper]
    info:
      path: Helper/Info.plist
      properties:
        CFBundleName: RyujinxHelper
    settings:
      base:
        PRODUCT_NAME: RyujinxHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.melotv.RyujinxHelper
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: NO

  # Replaces the prebuilt, iOS-only BreakpointJIT.framework. The allocator reaches
  # these three symbols through DllImport("BreakpointJIT.framework/BreakpointJIT"),
  # so the framework name and the C symbol names both have to match exactly.
  BreakpointJIT:
    type: framework
    platform: tvOS
    sources: [BreakpointJIT]
    info:
      path: BreakpointJIT/Info.plist
      properties:
        CFBundleName: BreakpointJIT
    settings:
      base:
        PRODUCT_NAME: BreakpointJIT
        PRODUCT_BUNDLE_IDENTIFIER: com.melotv.BreakpointJIT
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: NO

  MeloTV:
    type: application
    platform: tvOS
    sources:
      - App
      # Pure-Foundation C bridge to the emulator core; reused unchanged.
      - path: ../MeloNX/MeloNX/App/Core/Ryujinx/RyujinxBridge.swift
        group: Bridge
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MeloTV
        CFBundleDisplayName: MeloTV
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UIRequiredDeviceCapabilities: [arm64]
        # Lets a paired DualSense drive the interface, not just gameplay.
        GCSupportsControllerUserInteraction: true
        GCSupportsMultipleMicroGamepads: true
        # SDL asks for this at startup; without it UIKit withholds indirect
        # (pointer/trackpad-style) input events, which is how the Siri Remote's
        # touch surface is delivered.
        UIApplicationSupportsIndirectInputEvents: true
    # No entitlements are requested. extended-virtual-addressing needs a paid
    # account, and requesting an entitlement the provisioning profile cannot
    # grant makes the install itself fail. It is also not needed here: Apple
    # silicon uses 16 KB pages, and the core only takes the giant flat address
    # space reservation when the host page size is <= 4 KB. On this hardware it
    # goes down the host-tracked path instead, which does not need it.
    dependencies:
      - target: RyujinxHelper
        embed: true
        codeSign: false
      # Not linked, only embedded: nothing in Swift calls it. The allocator reaches
      # it at runtime through DllImport, so it just has to be present in the bundle
      # under the name the DllImport spells.
      - target: BreakpointJIT
        embed: true
        codeSign: false
        link: false
      # Dropped in by CI from the tvos-core and tvos-deps workflow artifacts.
      #
      # The core dylib IS linked: the Swift side binds its exports by
      # @_silgen_name, so those symbols must resolve at link time.
      - framework: Frameworks/Ryujinx.Headless.SDL2.dylib
        embed: true
        codeSign: false
      # SDL2 and MoltenVK are NOT linked. Nothing in Swift calls them; the core
      # dlopens SDL2 via DllImport("SDL2") and reaches Vulkan through Silk.NET's
      # loader, both at runtime. Listing them as link dependencies makes Xcode
      # emit -lSDL2 / -lMoltenVK and the link fails with "library not found".
      # They only need to be present in the bundle.
      - framework: Frameworks/SDL2.framework
        embed: true
        link: false
        codeSign: false
      - framework: Frameworks/libMoltenVK.dylib
        embed: true
        link: false
        codeSign: false
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melotv.app
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # RyujinxBridge.swift returns C structs by value, so their definitions
        # have to be visible to Swift.
        SWIFT_OBJC_BRIDGING_HEADER: App/MeloTV-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../MeloNX/MeloNX/App/Core/Headers"
